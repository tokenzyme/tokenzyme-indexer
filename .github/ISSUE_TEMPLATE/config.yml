blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/tokenzyme/tokenzyme-indexer/security/advisories/new
    about: Never report vulnerabilities in a public issue. Use private disclosure — see SECURITY.md.
  - name: Report a smart contract issue
    url: https://github.com/tokenzyme/tokenzyme-contracts/issues
    about: Issues with the on-chain protocol belong in the contracts repository.
  - name: Ask a question
    url: https://github.com/tokenzyme/tokenzyme-indexer/discussions
    about: Questions and design discussions belong in Discussions, not issues.
