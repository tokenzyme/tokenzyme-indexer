name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Corepack must be enabled BEFORE setup-node: the `cache: yarn` option shells
      # out to `yarn cache dir` inside that step, and the runner's global Yarn 1
      # refuses to run for a project declaring packageManager: yarn@4.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn prettier --check './**/*.{ts,cts,mts,js,cjs,mjs,json,yml,yaml}'
